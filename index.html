<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>PDF 页面裁剪工具</title>
  <style>/*STYLE*/</style>
</head>
<body>
<main>
  <input type="file" id="file" accept=".pdf,application/pdf" hidden>
  <section id="welcome" aria-labelledby="welcomeTitle">
    <div class="crop-study" aria-hidden="true">
      <div class="sheet-back"></div>
      <div class="sheet-front">
        <div class="sheet-copy"><i></i><i></i><i></i><i></i></div>
        <div class="sample-selection"><b></b><b></b><b></b><b></b></div>
      </div>
      <i class="sample-pointer"></i>
    </div>
    <h1 id="welcomeTitle">裁剪 PDF</h1>
    <p>将文件拖到这里，在本地裁剪。</p>
    <button id="pick" class="primary"><span class="icon icon-folder" aria-hidden="true"></span>选择 PDF 文件</button>
  </section>

  <section id="editor" aria-label="PDF 裁剪编辑器" hidden>
    <header class="docrow">
      <div class="docname"><span class="icon icon-file" aria-hidden="true"></span><div class="doclabel"><h1 id="name"></h1><span id="summary"></span></div></div>
      <strong id="cropNotice">裁剪改变的是显示范围，原始内容还在。</strong>
      <button id="save" class="primary" title="另存裁剪后的 PDF" aria-describedby="cropNotice"><span class="icon icon-save" aria-hidden="true"></span>导出 PDF</button>
    </header>
    <div id="stage" aria-label="页面预览"><div id="paper"><canvas id="canvas"></canvas><div id="box" role="img" aria-label="裁剪保留区域"></div></div></div>
    <div class="toolbar">
      <nav aria-label="页面导航">
        <button id="prev" class="arrow" aria-label="上一页" title="上一页"><span class="icon icon-back" aria-hidden="true"></span></button>
        <input id="pageNum" type="number" min="1" aria-label="当前页">
        <span id="total"></span><button id="next" class="arrow" aria-label="下一页" title="下一页"><span class="icon icon-forward" aria-hidden="true"></span></button>
      </nav>
      <div class="tools">
        <button id="draw" aria-pressed="false" title="拖出新的保留区域"><span class="icon icon-crop" aria-hidden="true"></span>重新框选</button>
        <button id="auto"><span class="icon icon-auto" aria-hidden="true"></span>自动去白边</button>
        <button id="settingsButton" aria-haspopup="dialog"><span class="icon icon-settings" aria-hidden="true"></span>裁剪设置</button>
      </div>
    </div>
  </section>
  <div id="statusDock"><div id="status" role="status" aria-live="polite"></div></div>
</main>
<footer><details class="licenses"><summary>开源许可</summary><pre>__LICENSES__</pre></details></footer>

<dialog id="settings" aria-labelledby="settingsTitle">
  <header class="panelhead"><h2 id="settingsTitle">裁剪设置</h2><button id="closeSettings" class="close" aria-label="关闭设置" autofocus><span class="icon icon-close" aria-hidden="true"></span></button></header>
  <div class="panelbody">
    <fieldset>
      <legend>页边距 <small>mm</small></legend>
      <div class="margins">
        <label>上<input id="top" type="number" min="0" step="0.1" inputmode="decimal"></label>
        <label>下<input id="bottom" type="number" min="0" step="0.1" inputmode="decimal"></label>
        <label>左<input id="left" type="number" min="0" step="0.1" inputmode="decimal"></label>
        <label>右<input id="right" type="number" min="0" step="0.1" inputmode="decimal"></label>
      </div>
      <p id="dims"></p>
    </fieldset>
    <details class="section" id="batch">
      <summary>应用到其他页面</summary>
      <div class="options">
        <label>目标页面<select id="scope"><option value="all">全部页面</option><option value="range">指定页码</option><option value="odd">奇数页</option><option value="even">偶数页</option></select></label>
        <label id="rangeField" hidden>页码范围<input id="range" placeholder="例如 1, 3–5, 8"></label>
        <label>边距换算<select id="units"><option value="fraction">保持相同比例</option><option value="mm">保持相同毫米数</option></select></label>
        <button id="apply" class="primary">应用当前选框</button>
      </div>
    </details>
    <details class="section" id="more">
      <summary>更多操作</summary>
      <div class="options">
        <label>预览缩放<select id="zoom"><option value="1">适应窗口</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select></label>
        <div class="row"><button id="undo"><span class="icon icon-undo" aria-hidden="true"></span>撤销</button><button id="redo"><span class="icon icon-redo" aria-hidden="true"></span>重做</button><button id="reset">重置本页</button></div>
        <button id="open"><span class="icon icon-folder" aria-hidden="true"></span>打开其他 PDF</button>
      </div>
    </details>
    <div id="panelStatus"></div>
  </div>
</dialog>
<script id="assets" type="application/json">__ASSETS__</script>
<script type="module">/*APP*/</script>
</body></html>
